url: https://iamstein.github.io/synpmx/

template:
  bootstrap: 5

# Renamed articles. Keep the old URLs working for anyone holding a link:
# avatar-mathematics -> avatar-algorithm on 2026-07-27; synpmx-demo ->
# avatar-evaluation-public-data on 2026-08-04, when the demo was recognized as
# an evaluation of the algorithm rather than a tutorial, and that in turn ->
# public-data-examples on 2026-08-13, for a name short enough to say. On
# 2026-08-11 literature-review was split in two; its old URL lands on the
# generation half, which is where the article used to begin.
redirects:
  - ["articles/avatar-mathematics.html", "articles/avatar-algorithm.html"]
  - ["articles/synpmx-demo.html", "articles/public-data-examples.html"]
  - ["articles/avatar-evaluation-public-data.html", "articles/public-data-examples.html"]
  - ["articles/literature-review.html", "articles/synthetic-data-generation-review.html"]

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: "Guides"
      - text: "Demo: one dataset, end to end"
        href: articles/demo.html
      - text: The synpmx AVATAR Algorithm
        href: articles/avatar-algorithm.html
      - text: Evaluating AVATAR on public data
        href: articles/public-data-examples.html
      - text: Checks of the synthetic data
        href: articles/scorecard-synthetic-data-checks.html
      - text: The four synpmx data generation algorithms
        href: articles/synpmx-4-methods.html
      - text: -------
      - text: "Background"
      - text: "Literature: generating synthetic data"
        href: articles/synthetic-data-generation-review.html
      - text: "Literature: checking synthetic data"
        href: articles/synthetic-data-checking-review.html
      - text: -------
      - text: "AVATAR method exploration"
      - text: "Example: are relationships preserved?"
        href: articles/example-avatar-PKPD-covariate-treatment-effect.html
      - text: -------
      - text: "Differential privacy background"
      - text: Privacy
        href: articles/synpmx-privacy.html
      - text: Privacy background
        href: articles/privacy-background.html
      - text: Formal privacy argument
        href: articles/privacy-argument.html
      - text: Feasibility by cohort size
        href: articles/feasibility.html


reference:
- title: Generating data
  desc: >
    The four generation modes. `synpmx_avatar()` is the default AVATAR path;
    the others require a public structural model.
  contents:
  - synpmx_avatar
  - synpmx_prior
  - synpmx_calibrated
  - synpmx_empirical
  - synpmx_generate

- title: Declaring the data
  desc: Roles, endpoints, schema, and bounds that describe an event table.
  contents:
  - pmx_roles
  - pmx_endpoint
  - pmx_schema
  - pmx_bounds
  - pmx_generated_roles

- title: Public model and design inputs
  desc: >
    Data-independent inputs for the model-based modes. See the model and data
    elicitation articles for how to produce these without reading data.
  contents:
  - pmx_structural_model
  - pmx_trial_design
  - pmx_public_design
  - pmx_prior
  - pmx_priors
  - pmx_covariate
  - pmx_covariates
  - pmx_covariates_auto

- title: Privacy accounting
  desc: Contribution limits, budget, preflight, and the release ledger.
  contents:
  - pmx_contribution_limits
  - pmx_budget_allocation
  - pmx_preflight
  - privacy_report
  - validate_private_model
  - dp_backend_status
  - run_dp_backend_tests
  - synpmx_enable_dp_engines
  - synpmx_disable_dp_engines

- title: Validation and diagnostics
  desc: Structural checks on generated data, and restricted comparisons.
  contents:
  - synpmx_scorecard
  - validate_pmx
  - pmx_endpoint_types
  - compare_pmx
  - compare_pmx_distributions
  - compare_pmx_rare_levels
  - compare_pmx_strata_sizes
  - skeleton_uniqueness
  - plot_pmx_schedule
  - pmx_masking_report
  - compare_pmx_proximity
  - flag_identifiable_subjects
  - remediate_identifiable_subjects
  - sampling_summary
  - strata_summary

- title: Fixtures
  desc: Fully public example datasets for testing and demonstration.
  contents:
  - pmx_censoring_fixture
  - pmx_simulated_fixture
